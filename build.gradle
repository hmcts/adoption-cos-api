plugins {
  id 'application'
  id 'jacoco'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springframework.boot' version '3.4.11'
  id 'uk.gov.hmcts.java' version '0.12.68'
  id 'org.sonarqube' version '5.0.0.4638'
  id 'com.github.ben-manes.versions' version '0.51.0'
  id 'cz.habarta.typescript-generator' version '3.2.1263'
  id 'hmcts.ccd.sdk' version '6.1.0'
  id 'com.github.hmcts.rse-cft-lib' version '0.19.1844'
  id 'au.com.dius.pact' version '4.3.8'
}

group = 'uk.gov.hmcts'
version = '0.0.1'

application {
  mainClass = 'uk.gov.hmcts.reform.adoption.Application'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

sourceSets {
  functionalTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/functionalTest/java')
    }
  }

  integrationTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/integrationTest/java')
    }
  }

  contractTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
    }
  }
}

configurations {
  functionalTestImplementation.extendsFrom testImplementation
  functionalTestRuntimeOnly.extendsFrom testRuntimeOnly

  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom testRuntimeOnly

  contractTestImplementation.extendsFrom testImplementation
  contractTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << '-Xlint:unchecked' << '-Werror'
}

tasks.withType(JavaExec).configureEach {
  javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()

  failFast = true

  testLogging {
    exceptionFormat = 'full'
  }
}

tasks.register('integration', Test) {
  description = 'Runs integration tests'
  group = 'Verification'
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
}

tasks.register('yarnInstall', Exec) {
  workingDir '.'
  commandLine 'yarn', 'install'
}

tasks.register('smoke', Test) {
  dependsOn tasks.named('yarnInstall')
  description = 'Runs smoke tests'
  group = 'Verification'

  doLast {
    exec {
      commandLine 'yarn', 'test:smoke'
    }
  }
}

tasks.register('functional', Test) {
  dependsOn tasks.named('yarnInstall')
  description = 'Runs functional tests'
  group = 'Verification'

  doLast {
    exec {
      commandLine 'yarn', 'test:functional'
    }
  }
}

tasks.register('highLevelDataSetup', JavaExec) {
  mainClass = 'uk.gov.hmcts.reform.adoption.common.ccd.HighLevelDataSetupApp'
  classpath += sourceSets.main.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED']
}

tasks.register('contract', Test) {
  description = 'Runs the consumer Pact tests'
  group = 'Verification'
  testClassesDirs = sourceSets.contractTest.output.classesDirs
  classpath = sourceSets.contractTest.runtimeClasspath
}

tasks.register('fortifyScan', JavaExec) {
  mainClass = 'uk.gov.hmcts.fortifyclient.FortifyClientMainApp'
  classpath += sourceSets.test.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED']
}

jacocoTestReport {
  executionData(test)
  reports {
    xml.getRequired().set(true)
    csv.getRequired().set(false)
    xml.outputLocation = file("${buildDir}/reports/jacoco/test/jacocoTestReport.xml")
  }
}

jacoco {
  toolVersion = '0.8.13'
}

jacocoTestCoverageVerification {
  violationRules {
    rule {
      limit {
        counter = 'LINE'
        value = 'COVEREDRATIO'
        minimum = 0.0
      }
    }
  }
}

dependencyCheck {
  suppressionFile = 'config/owasp/suppressions.xml'
}

tasks.named('sonarqube') {
  dependsOn jacocoTestReport
}

