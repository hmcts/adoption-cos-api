ext.getVaultSecret = { String secretName ->
  new ByteArrayOutputStream().withStream { os ->
    exec {
      commandLine 'az', 'keyvault', 'secret', 'show', '--vault-name', 'adoption-aat', '-o', 'tsv', '--query', 'value', '--name', secretName
      standardOutput = os
    }
    return os.toString().replace('\n', '')
  }
}

def loadAatSecrets = { task ->
  task.systemProperty 'IDAM_API_BASEURL', 'https://idam-api.aat.platform.hmcts.net'
  task.systemProperty 'UK_GOV_NOTIFY_API_KEY', getVaultSecret('uk-gov-notify-api-key')
  task.systemProperty 'S2S_SECRET', getVaultSecret('s2s-secret-cos-api')
  task.systemProperty 'IDAM_SYSTEM_UPDATE_USERNAME', getVaultSecret('idam-system-user-name')
  task.systemProperty 'IDAM_SYSTEM_UPDATE_PASSWORD', getVaultSecret('idam-system-user-password')
  task.systemProperty 'IDAM_SOLICITOR_USERNAME', getVaultSecret('idam-solicitor-username')
  task.systemProperty 'IDAM_SOLICITOR_PASSWORD', getVaultSecret('idam-solicitor-password')
  task.systemProperty 'APP_INSIGHTS_KEY', getVaultSecret('AppInsightsInstrumentationKey')
  task.systemProperty 'LAUNCH_DARKLY_SDK_KEY', getVaultSecret('launchDarkly-sdk-key')
  task.systemProperty 'SEND_GRID_API_KEY', getVaultSecret('send-grid-api-key')
  task.systemProperty 'SEND_GRID_NOTIFY_FROM_EMAIL', getVaultSecret('sendgrid-notify-from-email')
}

def loadDotEnv = { ExecSpec spec ->
  file('../.env').readLines()
    .findAll { it.contains('=') && !it.startsWith('#') }
    .each {
      def index = it.indexOf('=')
      spec.environment it.substring(0, index), it.substring(index + 1)
    }
}

bootRun {
  doFirst {
    if (System.getenv('IDAM_API_BASEURL') == null) {
      println 'Loading secrets from vault'

      loadAatSecrets(delegate)
      systemProperty 'IDAM_CLIENT_SECRET', getVaultSecret('idam-secret')

      if (System.getenv('BOOT_RUN_DOCKER')) {
        systemProperty 'IDAM_API_BASEURL', 'http://localhost:5000'
        systemProperty 'CASE_DATA_STORE_BASEURL', 'http://localhost:4452'
      }
    }
  }
}

bootJar {
  archiveFileName = 'adoption-cos-api.jar'

  manifest {
    attributes('Implementation-Version': project.version.toString())
  }
}

tasks.named('functional') {
  doFirst {
    if (System.getenv('OAUTH2_CLIENT_SECRET') == null) {
      println 'Loading secrets from vault'

      loadAatSecrets(delegate)
      systemProperty 'OAUTH2_CLIENT_SECRET', getVaultSecret('idam-secret')
      secret('caseworker-username', 'CASEWORKER_USERNAME')
      secret('caseworker-password', 'CASEWORKER_PASSWORD')
      secret('s2s-secret', 'S2S_SECRET_WEB')
    }
  }
}

generateTypeScript {
  jsonLibrary = 'jackson2'
  classPatterns = [
    'uk.gov.hmcts.reform.adoption.**.model.*',
    'uk.gov.hmcts.ccd.sdk.type.*',
  ]
  outputFile = 'build/ts/index.ts'
  outputKind = 'module'
  outputFileType = 'implementationFile'
  mapEnum = 'asEnum'
  mapDate = 'asString'
  group = 'ccd tasks'

  doLast {
    exec {
      commandLine 'yarn', 'prepublishOnly'
    }
  }
}

ccd {
  configDir = file('build/definitions')
}

tasks.register('stopCosApiContainer') {
  group = 'ccd tasks'

  doFirst {
    exec {
      executable "sh"
      args "-c", "docker stop adoption-cos-api || exit 0"
    }
  }
}

def reloadCcd = tasks.register('reloadCcd') {
  group = 'ccd tasks'

  doLast {
    exec {
      loadDotEnv(delegate)
      commandLine './bin/process-and-import-ccd-definition.sh'
    }

    exec {
      loadDotEnv(delegate)
      commandLine 'docker-compose', '-f', '../docker-compose.yml', 'up', '--build', '-d', 'adoption-cos-api'
    }
  }
}

reloadCcd.configure {
  dependsOn assemble, generateCCDConfig
}

generateCCDConfig.dependsOn tasks.named('stopCosApiContainer')

generateCCDConfig.doLast {
  copy {
    from file('ccd-definitions')
    into layout.buildDirectory.dir('definitions/A58')
  }
}

def contractTestConstantsFile = file('src/contractTest/java/uk/gov/hmcts/reform/adoption/ContractTestConstants.java')
if (!contractTestConstantsFile.exists()) {
  throw new GradleException("Missing ContractTestConstants.java for pacticipant alignment.")
}
def contractTestConstantsMatcher = (contractTestConstantsFile.text =~ /CONSUMER_NAME\s*=\s*"([^"]+)"/)
if (!contractTestConstantsMatcher.find()) {
  throw new GradleException("Unable to read CONSUMER_NAME from ContractTestConstants.java for pacticipant alignment.")
}
def contractTestConsumerName = contractTestConstantsMatcher.group(1)
def pactBrokerUrl = System.getenv("PACT_BROKER_FULL_URL")
  ?: project.findProperty('pact.broker.url')?.toString()
  ?: project.findProperty('pactbroker.url')?.toString()
def pactBranchName = System.getenv("PACT_BRANCH_NAME") ?: 'Dev'
// Use a different variable name to avoid Groovy DELEGATE_FIRST shadowing inside pact {} closures
def resolvedBrokerUrl = pactBrokerUrl

project.ext {
  pacticipant = contractTestConsumerName
  pacticipantVersion = getCheckedOutGitCommitHash()
}

tasks.register('runAndPublishConsumerPactTests', Test) {
  logger.lifecycle('Runs pact tests')
  testClassesDirs = sourceSets.contractTest.output.classesDirs
  classpath = sourceSets.contractTest.runtimeClasspath

  dependsOn tasks.named('contract')
  finalizedBy tasks.named('pactPublish')
}

tasks.named('pactPublish') {
  doFirst {
    logger.lifecycle("pactPublish doFirst: resolvedBrokerUrl='${resolvedBrokerUrl}'")
    logger.lifecycle("pactPublish doFirst: pact.publish.pactBrokerUrl='${project.pact?.publish?.pactBrokerUrl}'")
    logger.lifecycle("pactPublish doFirst: pact.broker.pactBrokerUrl='${project.pact?.broker?.pactBrokerUrl}'")
  }
  onlyIf {
    if (!resolvedBrokerUrl) {
      logger.lifecycle("No pact broker URL configured; skipping pactPublish.")
      return false
    }
    return true
  }
}

pact {
  broker {
    it.pactBrokerUrl = resolvedBrokerUrl ?: 'http://localhost:80'
  }
  publish {
    it.pactDirectory = 'pacts'
    it.pactBrokerUrl = resolvedBrokerUrl ?: 'http://localhost:80'
    it.tags = [pactBranchName]
    it.consumerVersion = project.pacticipantVersion
  }
}

static def getCheckedOutGitCommitHash() {
  'git rev-parse --verify --short HEAD'.execute().text.trim()
}

tasks.register('loadEnvSecrets') {
  doLast {
    if (!project.file('build/cftlib/.aat-env').exists()) {
      new ByteArrayOutputStream().withStream { os ->
        exec {
          commandLine 'az', 'keyvault', 'secret', 'show', '--vault-name', 'adoption-aat', '-o', 'tsv', '--query', 'value', '--name', 'adoption-cos-api-dot-env'
          standardOutput = os
        }
        project.file('build/cftlib/.aat-env').write(new String(os.toString().replace('\n', '').decodeBase64(), java.nio.charset.StandardCharsets.UTF_8))
      }
    }
  }
}

tasks.register('buildCCDXlsx', Exec) {
  dependsOn generateCCDConfig
  group = 'ccd tasks'
  commandLine './bin/ccd-build-definition.sh'
  inputs.dir layout.buildDirectory.dir('definitions')
  outputs.dir layout.buildDirectory.dir('ccd-config')
}

bootWithCCD {
  dependsOn tasks.named('loadEnvSecrets'), tasks.named('buildCCDXlsx')
  doFirst() {
    project.file('build/cftlib/.aat-env').readLines().each() {
      if (it.contains("=")) {
        def index = it.indexOf("=")
        def key = it.substring(0, index)
        def value = it.substring(index + 1)
        environment key, value
      }
    }
  }
  authMode = uk.gov.hmcts.rse.AuthMode.AAT
}
